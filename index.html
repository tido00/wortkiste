<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wortkiste</title>
<meta name="description" content="German flashcards, A1 to A2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wortkiste">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f7f6f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
:root {
  --bg: #f7f6f2; --surface: #ffffff; --surface-2: #efede7; --text: #1d1f23; --muted: #6b6f76; --line: #dedbd3;
  --accent: #1f4e79; --accent-text: #ffffff; --ok: #15803d; --bad: #b91c1c; --warn: #c2410c; --hard: #a16207;
  --der: #1d5fd8; --die: #d02525; --das: #13873d;
  --der-bg: #e6eefc; --die-bg: #fde9e9; --das-bg: #e5f5ea;
  --radius: 16px; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16181d; --surface: #20232a; --surface-2: #2a2e36; --text: #eceef1; --muted: #9aa0a8; --line: #343944;
    --accent: #7fb2e5; --accent-text: #0f1a26; --ok: #4ade80; --bad: #f87171; --warn: #fb923c; --hard: #facc15;
    --der: #6ea8ff; --die: #ff7a7a; --das: #4fd67f;
    --der-bg: #1c2a44; --die-bg: #3a1f22; --das-bg: #183324;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-tap-highlight-color: transparent; overflow-x: hidden;
}
button, input, select { font: inherit; color: inherit; }
#app { max-width: 560px; margin: 0 auto; min-height: 100vh;
  padding: calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 96px) calc(env(safe-area-inset-left) + 16px); }
body.no-tabs #app { padding-bottom: calc(env(safe-area-inset-bottom) + 24px); }
h1 { font-size: 28px; margin: 8px 0 4px; letter-spacing: -.02em; }
h2 { font-size: 19px; margin: 24px 0 8px; }
h3 { font-size: 16px; margin: 16px 0 6px; }
p { margin: 8px 0; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.tiny { font-size: 12px; }
.center { text-align: center; }
.row { display: flex; gap: 8px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.spread { justify-content: space-between; }
.grow { flex: 1; }
.stack > * + * { margin-top: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
.card + .card { margin-top: 12px; }
.btn { min-height: 48px; padding: 10px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface);
  font-weight: 600; color: var(--text); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; touch-action: manipulation; }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--accent); color: var(--accent-text); border-color: transparent; }
.btn.block { width: 100%; }
.btn.ghost { background: transparent; }
.btn.small { min-height: 44px; padding: 6px 12px; font-size: 15px; }
.btn:disabled { opacity: .45; }
.btn.danger { color: var(--bad); }
.icon-btn { min-width: 44px; min-height: 44px; border-radius: 22px; border: 1px solid var(--line); background: var(--surface); font-size: 20px; cursor: pointer; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.stat { font-size: 30px; font-weight: 700; line-height: 1.1; }
.pill { display: inline-block; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); font-size: 12px; font-weight: 600; color: var(--muted); }
.notice { border-left: 4px solid var(--warn); padding: 10px 12px; background: var(--surface); border-radius: 8px; margin: 12px 0; }

/* Articles */
.art-der { color: var(--der); } .art-die { color: var(--die); } .art-das { color: var(--das); }
.abtn { min-height: 56px; font-size: 22px; font-weight: 700; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); cursor: pointer; }
.abtn.der { color: var(--der); } .abtn.die { color: var(--die); } .abtn.das { color: var(--das); }
.abtn.chosen.der { background: var(--der-bg); border-color: var(--der); }
.abtn.chosen.die { background: var(--die-bg); border-color: var(--die); }
.abtn.chosen.das { background: var(--das-bg); border-color: var(--das); }
.abtn.right { outline: 3px solid var(--ok); outline-offset: 2px; }

/* Tabs */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line);
  display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom); z-index: 10; }
nav.tabs a { flex: 1; max-width: 186px; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-decoration: none; color: var(--muted); font-size: 12px; font-weight: 600; }
nav.tabs a span { font-size: 22px; line-height: 1.1; }
nav.tabs a.on { color: var(--accent); }
body.no-tabs nav.tabs { display: none; }

/* Study */
.topbar { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.progress { flex: 1; height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.progress > div { height: 100%; background: var(--accent); width: 0; transition: width .2s; }
.study { min-height: 300px; display: flex; flex-direction: column; }
.front { text-align: center; padding: 12px 4px; }
.de { font-size: 34px; font-weight: 700; line-height: 1.2; letter-spacing: -.01em; overflow-wrap: anywhere; }
.de.md { font-size: 26px; }
.en { font-size: 22px; font-weight: 600; overflow-wrap: anywhere; }
.fr { font-size: 15px; color: var(--muted); margin-top: 2px; }
.emoji { font-size: 56px; line-height: 1.1; }
.prompt { color: var(--muted); font-size: 15px; margin: 10px 0; }
.back { border-top: 1px dashed var(--line); margin-top: 14px; padding-top: 14px; text-align: center; }
.ex { margin-top: 10px; font-size: 18px; }
.ex .exen { font-size: 14px; color: var(--muted); }
.tip { margin-top: 10px; font-size: 15px; background: var(--surface-2); border-radius: 10px; padding: 8px 10px; text-align: left; }
.ff { margin-top: 8px; font-size: 15px; color: var(--warn); font-weight: 600; text-align: left; }
.gap { display: inline-block; min-width: 3.2em; border-bottom: 3px solid var(--accent); margin: 0 2px; }
mark { background: transparent; color: var(--accent); font-weight: 800; text-decoration: underline; text-underline-offset: 4px; }
.badge { font-size: 13px; color: var(--muted); }
.grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 16px; }
.grades button { min-height: 60px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4px; }
.grades button small { font-weight: 500; font-size: 12px; color: var(--muted); }
.grades .g1 { color: var(--bad); } .grades .g2 { color: var(--hard); } .grades .g3 { color: var(--ok); } .grades .g4 { color: var(--accent); }
.grades button.suggest { outline: 3px solid currentColor; outline-offset: 1px; }
.hintline { text-align: center; font-size: 13px; color: var(--muted); margin-top: 8px; }
.tiles { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 12px 0; min-height: 52px; }
.tile { min-height: 44px; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 18px; font-weight: 600; cursor: pointer; }
.tile.used { visibility: hidden; }
.answer-line { min-height: 60px; border: 2px dashed var(--line); border-radius: 12px; padding: 6px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-items: center; }
.answer-line .tile { background: var(--surface-2); }
input[type=text], input[type=number], select { min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); padding: 8px 12px; width: 100%; }
input.typing { font-size: 22px; text-align: center; }
.result-ok { color: var(--ok); font-weight: 700; } .result-bad { color: var(--bad); font-weight: 700; } .result-almost { color: var(--hard); font-weight: 700; }
.choices { display: grid; gap: 8px; margin-top: 12px; }
.choice { min-height: 52px; text-align: left; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 17px; }
.choice.right { border-color: var(--ok); background: var(--das-bg); } .choice.wrong { border-color: var(--bad); background: var(--die-bg); }

/* Settings */
.setting { padding: 12px 0; border-bottom: 1px solid var(--line); }
.setting:last-child { border-bottom: 0; }
.setting label.title { font-weight: 600; display: block; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.seg button { flex: 1; min-height: 44px; border: 0; background: var(--surface); cursor: pointer; font-weight: 600; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--accent); color: var(--accent-text); }
.switch { position: relative; width: 52px; height: 32px; flex: none; }
.switch input { opacity: 0; width: 100%; height: 100%; margin: 0; position: absolute; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; background: var(--surface-2); border: 1px solid var(--line); border-radius: 16px; transition: .2s; }
.switch span::after { content: ""; position: absolute; width: 26px; height: 26px; left: 2px; top: 2px; background: #fff; border-radius: 50%; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: .2s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(20px); }
.stepper { display: flex; align-items: center; gap: 10px; }
.stepper output { min-width: 2.2em; text-align: center; font-size: 22px; font-weight: 700; }
input[type=range] { width: 100%; min-height: 44px; accent-color: var(--accent); }

/* Lists and charts */
.list { list-style: none; padding: 0; margin: 0; }
.list li { padding: 10px 0; border-bottom: 1px solid var(--line); display: flex; gap: 8px; justify-content: space-between; align-items: center; }
.list li:last-child { border-bottom: 0; }
.bars { display: flex; align-items: flex-end; gap: 3px; height: 56px; margin-top: 8px; }
.bars div { flex: 1; background: var(--accent); border-radius: 3px 3px 0 0; min-height: 2px; opacity: .85; }
.bars div.zero { background: var(--line); }
.meter { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; margin-top: 6px; }
.meter div { height: 100%; background: var(--accent); }
.spark { width: 100%; height: 60px; }
.big-ctrl { min-height: 96px; font-size: 24px; }
.car-text { font-size: 30px; font-weight: 700; text-align: center; min-height: 120px; display: flex; flex-direction: column; justify-content: center; }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 80px); transform: translateX(-50%); background: var(--text); color: var(--bg);
  padding: 10px 16px; border-radius: 12px; font-size: 15px; z-index: 50; max-width: 90vw; }
.problem { font-size: 13px; padding: 8px 0; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
code { font-size: 13px; background: var(--surface-2); padding: 1px 4px; border-radius: 4px; }

/* v2: guided lesson */
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.streak { text-align: center; line-height: 1.1; }
.streak b { display: block; font-size: 22px; }
.streak span { font-size: 12px; color: var(--muted); }
.lesson-card { margin-top: 16px; display: grid; gap: 8px; }
.lesson-meta { font-size: 26px; font-weight: 800; letter-spacing: -.01em; }
.btn.big { min-height: 56px; font-size: 18px; border-radius: 14px; }
.btn.again { background: var(--bad); }
.dots { display: flex; gap: 5px; margin: 4px 0; }
.dots i { flex: 1; height: 8px; border-radius: 4px; background: var(--surface-2); }
.dots i.done { background: var(--ok); }
.dots i.now { background: var(--accent); }
.dots i.empty { opacity: .35; }
.topbar .dots { margin: 0; }
.step-label { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 2px 0 8px; }
.combo { min-height: 26px; text-align: center; }
.combo-pop { display: inline-block; font-weight: 800; color: var(--warn); animation: pop .35s ease-out; }
.pop-in { animation: rise .22s ease-out; }
@keyframes pop { 0% { transform: scale(.6); opacity: 0; } 70% { transform: scale(1.15); } 100% { transform: scale(1); opacity: 1; } }
@keyframes rise { from { transform: translateY(8px); opacity: .4; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .pop-in, .combo-pop { animation: none; } }
.gbtn { min-height: 64px; border-radius: 14px; font-size: 18px; font-weight: 800; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px solid; background: var(--surface); }
.gbtn small { font-size: 12px; font-weight: 500; color: var(--muted); }
.gbtn.miss { color: var(--bad); border-color: var(--bad); }
.gbtn.got { color: var(--surface); background: var(--ok); border-color: var(--ok); }
.gbtn.got small { color: var(--surface); opacity: .85; }
.linkbtn { background: none; border: 0; color: var(--muted); font-size: 14px; min-height: 44px; padding: 0 6px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.badge { font-size: 13px; color: var(--muted); text-align: right; }
.teach .emoji { margin-top: 4px; }
.sheet-back { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 560px; border-radius: 20px 20px 0 0; padding: 16px 16px calc(env(safe-area-inset-bottom) + 16px); display: grid; gap: 8px; animation: rise .2s ease-out; }
.sheet-item { min-height: 52px; display: flex; justify-content: space-between; align-items: center; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; cursor: pointer; }
.sheet-item.now { border: 2px solid var(--accent); }
.sheet-item:disabled { opacity: .45; }
.more-list { display: grid; gap: 8px; margin-top: 16px; }
.more-item { display: block; text-align: left; padding: 12px 14px; min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--text); text-decoration: none; cursor: pointer; width: 100%; }
.card.suggest { display: block; color: var(--text); text-decoration: none; border-color: var(--accent); }
.card.tight { padding: 12px 6px; margin-top: 0; }
.big-num { font-size: 44px; font-weight: 800; line-height: 1.1; margin-top: 6px; }
.meter.big { height: 10px; border-radius: 5px; }
.meter.big div { border-radius: 5px; }
.path { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.stop { display: flex; gap: 12px; position: relative; padding-bottom: 18px; }
.stop::before { content: ""; position: absolute; left: 10px; top: 24px; bottom: 0; width: 2px; background: var(--line); }
.stop:last-child::before { display: none; }
.stop > i { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--line); background: var(--surface); margin-top: 2px; }
.stop.done > i { background: var(--ok); border-color: var(--ok); }
.stop.now > i { border-color: var(--accent); background: var(--accent); box-shadow: 0 0 0 4px var(--surface-2); }
.stop.goal > i { border-color: var(--warn); }
/* Voice picker */
.voice-list { display: grid; gap: 8px; }
.voice-item { display: flex; gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: 14px; padding: 4px 6px 4px 4px; background: var(--surface); }
.voice-item.on { border: 2px solid var(--accent); }
.voice-pick { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 8px 10px; min-height: 52px; cursor: pointer; }
.voice-item.on .voice-pick > div:first-child::after { content: "  ✓"; color: var(--accent); }
a.icon-btn { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; color: var(--text); font-size: 26px; }
</style>
</head>
<body>
<div id="app"><p class="muted center" style="margin-top:40vh">Wortkiste wird geladen…</p></div>
<nav class="tabs" id="tabs">
  <a href="#/today" data-tab="today"><span>🏠</span>Today</a>
  <a href="#/journey" data-tab="journey"><span>🧭</span>Journey</a>
  <a href="#/me" data-tab="me"><span>👤</span>Me</a>
</nav>
<noscript>Wortkiste needs JavaScript.</noscript>
<script type="module" src="app.js"></script>
</body>
</html>
